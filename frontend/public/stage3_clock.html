<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;width:100vw;height:100vh;overflow:hidden}
.wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.clock{position:relative;width:260px;height:260px}
svg.face{position:absolute;top:0;left:0;width:100%;height:100%}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="clock">
    <svg class="face" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
      <circle cx="130" cy="130" r="128" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="2"/>
      <circle cx="130" cy="130" r="122" fill="none" stroke="#1a1a1a" stroke-width="1"/>
      <line x1="130" y1="10" x2="130" y2="26" stroke="#555" stroke-width="3"/>
      <line x1="194" y1="26" x2="186" y2="40" stroke="#555" stroke-width="3"/>
      <line x1="240" y1="74" x2="228" y2="82" stroke="#555" stroke-width="3"/>
      <line x1="252" y1="130" x2="236" y2="130" stroke="#555" stroke-width="3"/>
      <line x1="240" y1="186" x2="228" y2="178" stroke="#555" stroke-width="3"/>
      <line x1="194" y1="234" x2="186" y2="220" stroke="#555" stroke-width="3"/>
      <line x1="130" y1="250" x2="130" y2="234" stroke="#555" stroke-width="3"/>
      <line x1="66" y1="234" x2="74" y2="220" stroke="#555" stroke-width="3"/>
      <line x1="20" y1="186" x2="32" y2="178" stroke="#555" stroke-width="3"/>
      <line x1="8" y1="130" x2="24" y2="130" stroke="#555" stroke-width="3"/>
      <line x1="20" y1="74" x2="32" y2="82" stroke="#555" stroke-width="3"/>
      <line x1="66" y1="26" x2="74" y2="40" stroke="#555" stroke-width="3"/>
      <circle cx="130" cy="130" r="5" fill="#444"/>
    </svg>
    <canvas id="clock" width="260" height="260"></canvas>
  </div>
</div>
<script>
const canvas = document.getElementById('clock');
const ctx = canvas.getContext('2d');
const cx = 130, cy = 130;

let animId = null;
let running = true;
let frozenH = 0, frozenM = 0, frozenS = 0;
let dragging = null;

function drawHand(angle, len, width, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.lineTo(0, -len);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

function drawCenter() {
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#888';
  ctx.fill();
}

function drawFrozen() {
  ctx.clearRect(0, 0, 260, 260);
  drawHand(frozenH, 70, 4, '#aaaaaa');
  drawHand(frozenM, 95, 2.5, '#cccccc');
  drawHand(frozenS, 105, 1, '#777777');
  drawCenter();
}

function draw() {
  ctx.clearRect(0, 0, 260, 260);
  const now = new Date();
  now.setMinutes(now.getMinutes() - 1);
  const ms = now.getMilliseconds();
  const s = ((now.getSeconds() * 1000 + ms - 500) / 1000 + 60) % 60;
  const m = now.getMinutes();
  const h = now.getHours() % 12;

  frozenH = ((h + m / 60) / 12) * Math.PI * 2;
  frozenM = ((m + s / 60) / 60) * Math.PI * 2;
  frozenS = (s / 60) * Math.PI * 2;

  drawHand(frozenH, 70, 4, '#aaaaaa');
  drawHand(frozenM, 95, 2.5, '#cccccc');
  drawHand(frozenS, 105, 1, '#777777');
  drawCenter();

  if (running) animId = requestAnimationFrame(draw);
}

function clientToAngle(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const x = clientX - rect.left - cx;
  const y = clientY - rect.top  - cy;
  return Math.atan2(x, -y);
}

function angleDiff(a, b) {
  let d = Math.abs(a - b) % (Math.PI * 2);
  return d > Math.PI ? Math.PI * 2 - d : d;
}

window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data) return;

  if (data.type === 'clock-toggle') {
    if (data.on) {
      running = true;
      draw();
    } else {
      running = false;
      cancelAnimationFrame(animId);
      drawFrozen();
    }
    return;
  }

  if (data.type === 'clock-mouse') {
    if (running) return;
    const { ev, x, y } = data;
    if (ev === 'down') {
      const angle = clientToAngle(x, y);
      const dH = angleDiff(angle, frozenH);
      const dM = angleDiff(angle, frozenM);
      dragging = dH < dM ? 'hour' : 'minute';
    } else if (ev === 'move' && dragging) {
      const angle = (clientToAngle(x, y) + Math.PI * 2) % (Math.PI * 2);
      if (dragging === 'hour')   frozenH = angle;
      if (dragging === 'minute') frozenM = angle;
      drawFrozen();
    } else if (ev === 'up') {
      dragging = null;
    }
  }
});

draw();
</script>
</body>
</html>
